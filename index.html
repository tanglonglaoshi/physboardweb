<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    --bg: #060a14; --text: #e6edf7; --text-dim: #8fa3c0;
    --accent: #38bdf8; --accent-2: #a855f7; --glow: rgba(56, 189, 248, 0.5);
    --panel: rgba(16, 26, 44, 0.7); --border: rgba(120,180,255,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; line-height: 1.6; }
  
  #canvas-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

  nav { position: fixed; top: 0; left: 0; right: 0; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(6, 10, 20, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(56, 189, 248, 0.1); z-index: 100; }
  .logo { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }

  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; position: relative; }
  .hero h1 { font-size: clamp(36px, 8vw, 76px); font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 0 30px var(--glow); animation: float 6s ease-in-out infinite; }
  .hero .subtitle { font-family: ui-monospace, monospace; font-size: clamp(16px, 3vw, 22px); color: var(--accent); height: 40px; margin-bottom: 40px; }
  .cursor { display: inline-block; width: 12px; background-color: var(--accent); animation: blink 1s step-end infinite; }

  .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .btn { position: relative; padding: 15px 35px; font-size: 16px; font-weight: 600; color: #fff; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); border-radius: 30px; cursor: pointer; text-decoration: none; overflow: hidden; transition: all 0.3s; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); display: inline-block; }
  .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s; }
  .btn:hover { background: rgba(56, 189, 248, 0.2); box-shadow: 0 0 30px var(--glow); transform: translateY(-3px); }
  .btn:hover::before { left: 100%; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }

  .features { padding: 60px 20px 100px; max-width: 1200px; margin: 0 auto; }
  .section-title { text-align: center; font-size: 36px; margin-bottom: 60px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
  
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; backdrop-filter: blur(16px); transition: all 0.4s; position: relative; opacity: 0; transform: translateY(30px); cursor: pointer; display: flex; flex-direction: column; }
  .card.show { opacity: 1; transform: translateY(0); }
  .card:hover { border-color: var(--accent); box-shadow: 0 18px 55px rgba(56, 189, 248, 0.18); transform: translateY(-6px); }
  .card-cover { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: radial-gradient(120% 120% at 20% 0%, rgba(56,189,248,.22), transparent 55%), linear-gradient(135deg, #0b1526, #101f38); }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .5s; filter: saturate(1.05); }
  .card:hover .card-cover img { transform: scale(1.07); filter: saturate(1.15); }
  .card-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,10,20,0) 42%, rgba(6,10,20,.62) 100%); pointer-events: none; }
  .card-index { position: absolute; top: 12px; left: 12px; z-index: 2; font: 600 10px/1 ui-monospace, monospace; letter-spacing: 2px; color: #bae6fd; background: rgba(6,10,20,.62); border: 1px solid rgba(56,189,248,.35); padding: 5px 8px; border-radius: 6px; backdrop-filter: blur(6px); }
  .card-body { padding: 22px 24px 24px; display: flex; flex-direction: column; flex: 1; }
  .card h3 { font-size: 20px; margin-bottom: 10px; color: #fff; }
  .card p { color: var(--text-dim); font-size: 14px; margin-bottom: 18px; flex: 1; }
  .card .read-more { font-size: 13px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .card .read-more::after { content: '→'; transition: transform .3s; }
  .card:hover .read-more::after { transform: translateX(5px); }

  /* ================= 详情页：16:9 大图 + 玻璃文字面板 ================= */
  #detailView { position: fixed; inset: 0; z-index: 200; display: none; overflow: hidden;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(900px 600px at 92% 108%, rgba(168,85,247,.15), transparent 62%),
      rgba(4,8,16,.97);
    backdrop-filter: blur(22px);
  }
  #detailView.open { display: block; }
  .detail-topbar { position: absolute; top: 0; left: 0; right: 0; height: 88px; z-index: 20;
    display: flex; align-items: center; gap: 18px; padding: 0 36px;
    background: linear-gradient(180deg, rgba(4,8,16,.94), rgba(4,8,16,0));
  }
  .back-btn { position: static; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--accent); background: rgba(56,189,248,.08);
    border: 1px solid rgba(56,189,248,.4); transition: .2s; flex: none;
  }
  .back-btn:hover { background: rgba(56,189,248,.18); box-shadow: 0 0 22px rgba(56,189,248,.25); transform: translateY(-1px); }
  .detail-heading { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .detail-eyebrow { font: 600 10px/1.2 ui-monospace, monospace; letter-spacing: 4px; color: #64748b; text-transform: uppercase; }
  .detail-module { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-counter { margin-left: auto; flex: none; font: 600 13px/1 ui-monospace, monospace; letter-spacing: 2px; color: #7dd3fc;
    background: rgba(8,16,30,.65); border: 1px solid rgba(56,189,248,.25); padding: 9px 15px; border-radius: 999px; }
  .detail-counter #detailTotal { color: #475569; }
  .detail-counter-sep { margin: 0 5px; color: #334155; }

  .slider-wrapper { position: relative; width: 100%; height: 100%; padding: 92px 84px 56px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .detail-stage { width: min(1120px, 100%, calc(56vh * 1.7778)); height: 100%;
    display: flex; flex-direction: column; gap: 14px; }

  .visual-frame { position: relative; flex: none; width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; isolation: isolate; }
  .visual-glow { position: absolute; inset: -10px; z-index: -1; border-radius: 30px;
    background: conic-gradient(from 120deg, #38bdf8, #a855f7, #22d3ee, #38bdf8);
    filter: blur(22px); opacity: .35; animation: glowspin 12s linear infinite; }
  @keyframes glowspin { to { transform: rotate(360deg); filter: blur(26px) hue-rotate(35deg); } }
  .visual-inner { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: #04070f;
    border: 1px solid rgba(125,211,252,.35);
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 50px rgba(56,189,248,.12);
  }
  .slide-img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0;
    transform: scale(1.06); filter: blur(8px) saturate(.9);
    transition: opacity .5s ease, transform .8s cubic-bezier(.2,.8,.2,1), filter .8s ease;
  }
  .slide-img.active { opacity: 1; transform: scale(1); filter: blur(0) saturate(1.05); }
  .visual-scan { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.03) 3px 4px);
  }
  .visual-shade { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(2,6,16,0) 30%, rgba(2,6,16,.18) 58%, rgba(2,6,16,.9) 100%),
      linear-gradient(90deg, rgba(2,6,16,.38), transparent 38%);
  }
  .visual-caption { position: absolute; left: 28px; right: 28px; bottom: 22px; z-index: 3; }
  .visual-kicker { font: 600 10px/1.2 ui-monospace, monospace; letter-spacing: 4px; color: #7dd3fc; text-transform: uppercase; margin-bottom: 7px; opacity: .95; }
  .slide-title { font-size: clamp(21px, 2.7vw, 34px); font-weight: 800; color: #fff; line-height: 1.2;
    text-shadow: 0 4px 26px rgba(0,0,0,.85); opacity: 0; transform: translateY(16px);
    transition: .55s cubic-bezier(.2,.8,.2,1); border: none; padding: 0; margin: 0;
  }
  .slide-title.active { opacity: 1; transform: none; }
  .slide-title:empty { display: none; }
  .corner { position: absolute; width: 24px; height: 24px; z-index: 4; border: 2px solid rgba(125,211,252,.8); pointer-events: none; }
  .corner.tl { top: -7px; left: -7px; border-right: none; border-bottom: none; border-radius: 7px 0 0 0; }
  .corner.tr { top: -7px; right: -7px; border-left: none; border-bottom: none; border-radius: 0 7px 0 0; }
  .corner.bl { bottom: -7px; left: -7px; border-right: none; border-top: none; border-radius: 0 0 0 7px; }
  .corner.br { bottom: -7px; right: -7px; border-left: none; border-top: none; border-radius: 0 0 7px 0; }
  .visual-loading { position: absolute; inset: 0; display: none; place-items: center; z-index: 3; background: rgba(4,7,15,.5); }
  .visual-loading.show { display: grid; }
  .visual-loading span { width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(56,189,248,.2); border-top-color: #38bdf8; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .text-panel { position: relative; flex: 1 1 auto; min-height: 110px; border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, rgba(18,30,50,.82), rgba(8,14,26,.9));
    border: 1px solid rgba(120,180,255,.14);
    box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(18px);
  }
  .text-panel-head { flex: none; display: flex; align-items: center; gap: 9px; padding: 11px 22px;
    font: 600 10px/1 ui-monospace, monospace; letter-spacing: 3px; color: #64748b; text-transform: uppercase;
    border-bottom: 1px solid rgba(120,180,255,.08);
  }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 12px #22d3ee; animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 12px #22d3ee; } 50% { opacity: .35; box-shadow: 0 0 4px #22d3ee; } }
  .text-hint { margin-left: auto; font: 400 11px/1 system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: #475569; }
  .slide-text-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 24px 20px; scrollbar-width: thin; scrollbar-color: rgba(56,189,248,.35) transparent; }
  .slide-text-wrap::-webkit-scrollbar { width: 6px; }
  .slide-text-wrap::-webkit-scrollbar-thumb { background: rgba(56,189,248,.3); border-radius: 3px; }
  .slide-content { font-size: 15px; line-height: 1.8; color: #b8c7de; opacity: 0; transform: translateY(12px); transition: .5s ease .05s; }
  .slide-content.active { opacity: 1; transform: none; }
  .slide-content h2, .slide-content h3 { color: #fff; margin: 1em 0 .5em; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .slide-content p { margin-bottom: .9em; }
  .slide-content ul, .slide-content ol { padding-left: 20px; margin-bottom: .9em; }
  .slide-content li { margin: .25em 0; }
  .slide-content strong { color: #e6edf7; }
  .slide-content blockquote { border-left: 3px solid var(--accent); padding: 10px 14px; margin: .8em 0; color: #bae6fd; background: rgba(56,189,248,.06); border-radius: 0 8px 8px 0; }
  .slide-content img { max-width: 100%; border-radius: 8px; }

  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; color: #fff;
    background: rgba(8,16,30,.55); border: 1px solid rgba(120,180,255,.18); backdrop-filter: blur(10px); transition: .25s;
  }
  .nav-arrow:hover { background: rgba(56,189,248,.22); border-color: var(--accent); box-shadow: 0 0 26px rgba(56,189,248,.35); transform: translateY(-50%) scale(1.08); }
  .nav-arrow svg { width: 24px; height: 24px; opacity: .7; }
  .arrow-left { left: 20px; }
  .arrow-right { right: 20px; }

  .detail-progress { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: min(320px, 46vw); height: 3px;
    border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; z-index: 10;
  }
  .detail-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #38bdf8, #a855f7); box-shadow: 0 0 14px rgba(56,189,248,.7); transition: width .45s ease; }
  .dots-container { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); display: flex; gap: 9px; z-index: 10; }
  .dot { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); cursor: pointer; transition: .25s; }
  .dot.active { width: 36px; background: linear-gradient(90deg, #38bdf8, #a855f7); box-shadow: 0 0 12px rgba(56,189,248,.5); }

  @media (max-width: 900px) {
    .detail-topbar { height: 72px; padding: 0 14px; gap: 10px; }
    .back-btn { padding: 8px 13px; font-size: 12px; }
    .detail-module { font-size: 15px; }
    .detail-eyebrow { display: none; }
    .detail-counter { padding: 7px 11px; font-size: 11px; }
    .slider-wrapper { padding: 76px 12px 66px; }
    .detail-stage { width: 100%; gap: 10px; }
    .visual-caption { left: 16px; right: 16px; bottom: 14px; }
    .slide-title { font-size: 20px; }
    .text-panel { border-radius: 14px; }
    .text-panel-head { padding: 9px 14px; }
    .slide-text-wrap { padding: 12px 14px 16px; }
    .slide-content { font-size: 14px; }
    .nav-arrow { width: 40px; height: 40px; top: calc(76px + (100vw - 24px) * 0.28125); }
    .arrow-left { left: 6px; }
    .arrow-right { right: 6px; }
    .dots-container { bottom: 38px; }
    .detail-progress { bottom: 26px; }
    .text-hint { display: none; }
  }

  footer { text-align: center; padding: 40px 20px; border-top: 1px solid rgba(56, 189, 248, 0.1); color: var(--text-dim); font-size: 14px; position: relative; z-index: 10; background: var(--bg); }
  footer p { margin-bottom: 8px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>

<nav>

</nav>

<div id="listView">
  <section class="hero">

  <footer>

<div id="detailView">
  <div class="detail-topbar">
    <div class="back-btn" onclick="closeDetail()">← 返回列表</div>
    <div class="detail-heading">
      <div class="detail-eyebrow" id="detailEyebrow">FEATURE DETAIL</div>
      <h2 class="detail-module" id="detailModuleTitle"></h2>
    </div>
    <div class="detail-counter">
      <span id="detailIndex">01</span><span class="detail-counter-sep">/</span><span id="detailTotal">01</span>
    </div>
  </div>

  <div class="slider-wrapper" id="sliderWrapper">
    <div class="nav-arrow arrow-left" onclick="changeSlide(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="nav-arrow arrow-right" onclick="changeSlide(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="detail-stage">
      <div class="visual-frame">
        <div class="visual-glow"></div>
        <div class="visual-inner">
          <img id="currentImg" class="slide-img" src="" alt="" referrerpolicy="no-referrer">
          <div class="visual-scan"></div>
          <div class="visual-shade"></div>
          <div class="visual-caption">
            <div class="visual-kicker" id="visualKicker">SLIDE 01 / 01</div>
            <h2 id="currentTitle" class="slide-title"></h2>
          </div>
          <div class="visual-loading" id="visualLoading"><span></span></div>
        </div>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>

      <div class="text-panel">
        <div class="text-panel-head">
          <span class="dot-live"></span><span>功能说明</span>
          <span class="text-hint">滚轮 / ← → 翻页 · Esc 返回</span>
        </div>
        <div class="slide-text-wrap" id="slideTextWrap">
          <div id="currentContent" class="slide-content"></div>
        </div>
      </div>
    </div>

    <div class="detail-progress"><div class="detail-progress-fill" id="detailProgress"></div></div>
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function inlineMd(raw) {
    var s = escapeHtml(raw);
    var parts = s.split('**');
    for (var k = 1; k < parts.length; k += 2) parts[k] = '<strong>' + parts[k] + '</strong>';
    s = parts.join('');
    var codes = s.split(String.fromCharCode(96));
    for (var j = 1; j < codes.length; j += 2) codes[j] = '<code>' + codes[j] + '</code>';
    return codes.join('');
  }

  function simpleMarkdown(text) {
    var src = String(text == null ? '' : text).split(String.fromCharCode(13)).join('');
    var lines = src.split(String.fromCharCode(10));
    var out = [], para = [], list = null, code = null;

    function flushPara() {
      if (para.length) {
        out.push('<p>' + para.join('<br>') + '</p>');
        para = [];
      }
    }
    function closeList() {
      if (list) { out.push('</' + list + '>'); list = null; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      if (code !== null) {
        if (line.indexOf(String.fromCharCode(96, 96, 96)) === 0) {
          out.push('<pre><code>' + code.join(String.fromCharCode(10)) + '</code></pre>');
          code = null;
        } else {
          code.push(escapeHtml(line));
        }
        continue;
      }

      if (line.indexOf(String.fromCharCode(96, 96, 96)) === 0) {
        flushPara(); closeList(); code = []; continue;
      }
      if (!line.trim()) { flushPara(); closeList(); continue; }

      var n = 0;
      while (line.charAt(n) === '#') n++;
      if (n > 0 && n <= 4 && line.charAt(n) === ' ') {
        flushPara(); closeList();
        out.push('<h' + (n + 1) + '>' + inlineMd(line.slice(n + 1).trim()) + '</h' + (n + 1) + '>');
        continue;
      }

      if (line.charAt(0) === '>') {
        flushPara(); closeList();
        out.push('<blockquote>' + inlineMd(line.slice(1).trim()) + '</blockquote>');
        continue;
      }

      var bullet = (line.charAt(0) === '-' || line.charAt(0) === '*' || line.charAt(0) === '+') && line.charAt(1) === ' ';
      if (bullet) {
        flushPara();
        if (list !== 'ul') { closeList(); list = 'ul'; out.push('<ul>'); }
        out.push('<li>' + inlineMd(line.slice(2).trim()) + '</li>');
        continue;
      }

      var dot = line.indexOf('. ');
      var num = dot > 0 ? line.slice(0, dot) : '';
      if (num && String(parseInt(num, 10)) === num) {
        flushPara();
        if (list !== 'ol') { closeList(); list = 'ol'; out.push('<ol>'); }
        out.push('<li>' + inlineMd(line.slice(dot + 2).trim()) + '</li>');
        continue;
      }

      if (line.length >= 3 && line.split('-').join('') === '') {
        flushPara(); closeList(); out.push('<hr>'); continue;
      }

      closeList();
      para.push(inlineMd(line));
    }

    if (code !== null) out.push('<pre><code>' + code.join(String.fromCharCode(10)) + '</code></pre>');
    flushPara(); closeList();
    return out.join('') || '<p>' + escapeHtml(text || '') + '</p>';
  }

    return simpleMarkdown(src);
  }

  let touchStartY = 0, touchStartX = 0, touchOnImage = false;
  detailView.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchOnImage = !e.target.closest('.slide-text-wrap');
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  detailView.addEventListener('touchend', function (e) {
    if (!touchOnImage || !e.changedTouches.length) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      changeSlide(dy < 0 ? 1 : -1);
    }
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    if (!detailView.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') changeSlide(-1);
    if (e.key === 'ArrowRight') changeSlide(1);
    if (e.key === 'Escape') closeDetail();
  });

  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  let width, height;
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  const particles = [];
  for (let i = 0; i < 60; i++) { particles.push({ x: Math.random()*width, y: Math.random()*height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, radius: Math.random()*2+1 }); }
  function animate() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 - dist/1000})`; ctx.lineWidth = 0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
